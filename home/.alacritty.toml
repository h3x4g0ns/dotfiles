[general]
import = [
    "~/.config/alacritty/themes/themes/ayu_dark.toml"
]

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font]
size = 16

[window]
decorations = "None"
padding = { x = 10, y = 10 }
opacity = 1.0
